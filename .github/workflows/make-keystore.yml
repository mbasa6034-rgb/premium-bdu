name: Make keystore
on: workflow_dispatch
jobs:
  k:
    runs-on: ubuntu-latest
    steps:
      - name: Generate
        env:
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair -keystore k.jks -alias bdu -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=BDU PREMIUM, O=BDU, C=ET"
          echo '### Copy the long text below into secret KEYSTORE_BASE64' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          base64 -w0 k.jks >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
