<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
*{margin:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{height:100%}
body{background:linear-gradient(160deg,#1E1B4B,#4F46E5 55%,#7C3AED);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative}
.c{position:absolute;border-radius:50%;background:rgba(255,255,255,.07);animation:fl 7s ease-in-out infinite}
.c1{width:220px;height:220px;top:-60px;left:-70px}.c2{width:160px;height:160px;bottom:60px;right:-50px;animation-delay:-3s}.c3{width:90px;height:90px;top:30%;right:12%;animation-delay:-5s}
svg{width:min(72vw,300px);height:auto;overflow:visible;position:relative}
.bot{animation:bob 3s ease-in-out infinite}
.eye,.ok,.sd,.ico{transform-box:fill-box;transform-origin:center}
.eye{animation:blink 3.6s infinite}
.led{animation:pulse 1.2s infinite}
.ico{font-size:22px;animation:fl 4s ease-in-out infinite}
.ok{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
.sd{animation:sh 3s ease-in-out infinite}
h1{font-size:30px;font-weight:800;letter-spacing:1px;margin-top:8px;animation:fade .8s .4s ease both}
p{opacity:.85;font-size:14px;margin-top:6px;animation:fade .8s .7s ease both}
.ld{width:150px;height:6px;border-radius:99px;background:rgba(255,255,255,.2);margin-top:26px;overflow:hidden;animation:fade .6s 1s ease both}
.ld i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FBBF24,#F59E0B);border-radius:99px;animation:ld 2.5s .3s ease-out forwards}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(6deg)}}
@keyframes sh{0%,100%{transform:scaleX(1);opacity:.25}50%{transform:scaleX(.8);opacity:.12}}
@keyframes ld{to{width:100%}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style></head><body>
